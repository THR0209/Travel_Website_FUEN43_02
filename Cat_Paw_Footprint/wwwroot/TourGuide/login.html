<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>導遊登入</title>

    <!-- Bootstrap + Font Awesome -->
    <!-- ✅ 樣式 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css?v=20251103" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css?v=20251103" rel="stylesheet" />

    <!-- ✅ 前端核心 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js?v=20251103"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js?v=20251103"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11?v=20251103"></script>

    <!-- ✅ 本地腳本 -->
    <script src="/front-end/assets/js/webFront.js?v=20251103"></script>

    <!-- ✅ 引用 PWA manifest -->
    <link rel="manifest" href="/TourGuide/manifest.json" />


    <style>
        body {
            background: linear-gradient(135deg, #fff8f2, #fde5cc);
            font-family: "Segoe UI", system-ui, "微軟正黑體", sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            max-width: 420px;
            width: 100%;
            background: #fffdfa;
            border: none;
            border-radius: 1rem;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
            padding: 2rem;
        }

        .login-title {
            text-align: center;
            font-weight: 600;
            color: #c45a00;
            margin-bottom: 1.5rem;
        }

        .btn-primary {
            color: #ff8c42;
            border: 1px solid #ff8c42;
            background: transparent;
            border-radius: 999px;
            transition: all 0.25s ease;
            font-weight: 600;
        }

            .btn-primary:hover {
                background: #ff8c42;
                color: #fff;
                box-shadow: 0 0 0.4rem rgba(255, 140, 66, 0.35);
                transform: translateY(-2px);
            }

        .text-small {
            font-size: 0.9rem;
        }
    </style>
</head>

<body>
    <div id="guideApp" class="login-card">
        <h2 class="login-title">
            <i class="fa-solid fa-person-hiking me-2 text-primary"></i> 導遊登入
        </h2>

        <form @submit.prevent="login">
            <div class="mb-3">
                <label class="form-label">帳號</label>
                <input v-model.trim="account" class="form-control" autocomplete="username" required />
            </div>

            <div class="mb-3">
                <label class="form-label">密碼</label>
                <input v-model="password" type="password" class="form-control" autocomplete="current-password" required />
            </div>

            <button type="submit" class="btn btn-primary w-100" :disabled="loading">
                {{ loading ? "登入中..." : "登入" }}
            </button>
        </form>

        <div class="text-center mt-3">
            <span :style="{ color: messageColor }">{{ message }}</span>
        </div>

        <div class="text-center mt-4 text-small text-muted">
            © 2025 貓爪足跡 導遊端
        </div>
    </div>

    <script>
        const { createApp } = Vue;
        createApp({
            data() {
                return {
                    account: "",
                    password: "",
                    loading: false,
                    message: "",
                    messageColor: "#555"
                };
            },
            mounted() {
                // ✅ 若已登入過，直接導向群組清單
                if (localStorage.getItem("guideId")) {
                    location.href = "group-list.html";
                }

                // ✅ 註冊 Service Worker
                if ("serviceWorker" in navigator) {
                    navigator.serviceWorker.register("/TourGuide/service-worker.js")
                        .then(() => console.log("✅ Service Worker 已註冊"))
                        .catch(err => console.error("❌ SW 註冊失敗:", err));
                }
            },
            methods: {
                async login() {
                    this.message = "";
                    if (!this.account || !this.password) {
                        showAlert("warning", "輸入錯誤", "帳號或密碼不得為空");
                        return;
                    }

                    this.loading = true;
                    try {
                        const { data } = await axios.post("/api/TourGuideArea/TGLoginApi/Login", {
                            account: this.account,
                            password: this.password
                        });

                        if (!data || data.success === false) {
                            showAlert("error", "登入失敗", data?.message || "帳號或密碼錯誤");
                            return;
                        }

                        // ✅ 儲存導遊資訊
                        localStorage.setItem("guideAccount", data.account || this.account);
                        localStorage.setItem("guideName", data.guideName || "");
                        localStorage.setItem("guideId", data.guideId || "");
                        localStorage.setItem("role", "Guide");

                        // ✅ 登入後請求通知權限
                        if ("Notification" in window) {
                            if (Notification.permission !== "granted") {
                                Notification.requestPermission().then(result => {
                                    if (result === "granted") {
                                        console.log("✅ 通知權限已允許");
                                    } else {
                                        console.warn("⚠️ 使用者拒絕通知權限");
                                    }
                                });
                            }
                        }

                        // ✅ 彈窗提示登入成功
                        showAlert("success", "登入成功", `歡迎導遊 ${data.guideName || ""}`);
                        setTimeout(() => location.href = "group-list.html", 1200);

                    } catch (e) {
                        showAlert("error", "伺服器錯誤", "請稍後再試");
                    } finally {
                        this.loading = false;
                    }
                }
            }
        }).mount("#guideApp");
    </script>
</body>
</html>
