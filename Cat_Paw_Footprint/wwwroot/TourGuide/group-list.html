<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>我的群組</title>

    <!-- Bootstrap + Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <style>
        body {
            background: #f8f9fa;
            font-family: "Poppins", "微軟正黑體", sans-serif;
            padding: 2rem;
        }

        .group-card {
            max-width: 950px;
            margin: 2rem auto;
            background: #fff;
            border: none;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.1);
            padding: 2rem 2.5rem;
        }

        h2 {
            font-weight: 600;
            color: #333;
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .muted {
            color: #777;
        }

        .err {
            color: #b00020;
        }

        table {
            border: 1px solid #dee2e6;
        }

        th {
            background: #f1f3f5;
        }

        .footer-text {
            font-size: 0.9rem;
            color: #777;
            text-align: center;
            margin-top: 2rem;
        }
    </style>
</head>

<body>
    <div id="app" class="group-card">
        <h2>
            <i class="fa-solid fa-users-line me-2 text-primary"></i> 我的群組
            <span class="muted" v-if="guideName">（{{ guideName }}）</span>
        </h2>

        <div class="row g-4">
            <!-- 群組清單 -->
            <div class="col-md-6">
                <h5 class="mb-3"><i class="fa-solid fa-list-ul me-2"></i> 群組清單</h5>
                <div class="err mb-2" v-if="error">{{ error }}</div>

                <div v-if="groups.length">
                    <table class="table table-bordered table-sm align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>代碼</th>
                                <th>名稱</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr v-for="g in groups" :key="g.groupId">
                                <td>{{ g.groupId }}</td>
                                <td>{{ g.groupCode }}</td>
                                <td>{{ g.groupName }}</td>
                                <td>
                                    <button class="btn btn-outline-primary btn-sm" @click="enterChat(g)">
                                        進入聊天室
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div v-else class="text-muted">尚無群組</div>
            </div>

            <!-- 建立新群組 -->
            <div class="col-md-6">
                <h5 class="mb-3"><i class="fa-solid fa-plus me-2"></i> 建立新群組</h5>
                <div class="err mb-2" v-if="createError">{{ createError }}</div>

                <div class="mb-3">
                    <label class="form-label">群組名稱</label>
                    <input v-model.trim="form.groupName" class="form-control" placeholder="例如：東京五日遊" />
                </div>
                <div class="mb-3">
                    <label class="form-label">目的地（選填）</label>
                    <input v-model.trim="form.destination" class="form-control" />
                </div>
                <div class="mb-3">
                    <label class="form-label">開始日期</label>
                    <input v-model="form.start" type="date" class="form-control" />
                </div>
                <div class="mb-3">
                    <label class="form-label">結束日期</label>
                    <input v-model="form.end" type="date" class="form-control" />
                </div>

                <button @click="createGroup" class="btn btn-success w-100" :disabled="creating">
                    {{ creating ? "建立中…" : "建立群組" }}
                </button>
            </div>
        </div>

        <div class="footer-text">
            <a href="login.html" class="text-decoration-none me-2">
                <i class="fa-solid fa-right-from-bracket me-1"></i> 登出 / 重新登入
            </a>
        </div>
    </div>

    <script>
        const { createApp } = Vue;
        createApp({
            data() {
                return {
                    guideId: localStorage.getItem("guideId") || "",
                    guideName: localStorage.getItem("guideName") || "",
                    groups: [],
                    error: "",
                    creating: false,
                    createError: "",
                    form: { groupName: "", destination: "", start: "", end: "" },
                };
            },
            mounted() {
                this.fetchGroups();
            },
            methods: {
                async fetchGroups() {
                    this.error = "";
                    if (!this.guideId) {
                        this.error = "缺少 guideId，請重新登入。";
                        return;
                    }
                    try {
                        const { data } = await axios.get(
                            `/api/TourGuideArea/TGGroupApi/GetGroupsByGuideId/${this.guideId}`
                        );
                        this.groups = data || [];
                    } catch (e) {
                        this.error = "讀取群組失敗";
                    }
                },
                async createGroup() {
                    this.createError = "";
                    if (!this.form.groupName) {
                        this.createError = "群組名稱不得為空";
                        return;
                    }
                    this.creating = true;
                    try {
                        const payload = {
                            guideId: Number(this.guideId),
                            groupName: this.form.groupName,
                            destination: this.form.destination || null,
                            start: this.form.start || null,
                            end: this.form.end || null,
                        };
                        const { data } = await axios.post(
                            "/api/TourGuideArea/TGGroupApi/CreateGroup",
                            payload
                        );
                        if (!data || data.success === false) {
                            this.createError = data?.message || "建立失敗";
                            return;
                        }
                        await this.fetchGroups();
                        this.form = { groupName: "", destination: "", start: "", end: "" };
                    } catch (e) {
                        this.createError = "伺服器錯誤";
                    } finally {
                        this.creating = false;
                    }
                },
                enterChat(g) {
                    localStorage.setItem("groupId", g.groupId);
                    localStorage.setItem("groupCode", g.groupCode);
                    localStorage.setItem("groupName", g.groupName);
                    location.href = "chat.html";
                },
            },
        }).mount("#app");
    </script>
</body>
</html>
