<!doctype html>
<html lang="zh-Hant">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>訪客加入聊天室</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
            font-family: "Segoe UI", system-ui, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
            border: none;
            border-radius: 1rem;
        }

        .btn-join {
            background: linear-gradient(45deg, #4e54c8, #8f94fb);
            color: white;
            font-weight: 600;
            transition: all .3s;
        }

        .btn-join:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>

<body>
    <div class="card p-4" style="width: 360px;">
        <h4 class="text-center mb-3">🐾 訪客加入聊天室</h4>

        <form id="joinForm">
            <div class="mb-3">
                <label for="groupCode" class="form-label">群組代碼</label>
                <input type="text" id="groupCode" class="form-control" placeholder="輸入群組代碼" required>
            </div>

            <div class="mb-3">
                <label for="temporaryName" class="form-label">暱稱（可留空）</label>
                <input type="text" id="temporaryName" class="form-control" placeholder="顯示暱稱">
            </div>

            <button type="submit" class="btn btn-join w-100">加入群組</button>
        </form>

        <div id="result" class="alert mt-3 d-none"></div>
    </div>

    <script>
        // 自動生成訪客裝置識別碼
        const deviceIdKey = "CatPaw_DeviceId";
        let deviceId = localStorage.getItem(deviceIdKey);
        if (!deviceId) {
            deviceId = "dev-" + crypto.randomUUID();
            localStorage.setItem(deviceIdKey, deviceId);
        }

        const resultBox = document.getElementById("result");
        document.getElementById("joinForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const groupCode = document.getElementById("groupCode").value.trim();
            const temporaryName = document.getElementById("temporaryName").value.trim();

            const dto = { groupCode, temporaryName, deviceId };

            try {
                const res = await axios.post("/api/TalkMessageApi/JoinAsGuest", dto);
                const msg = res.data.message || "未知回應";
                alert("✅ " + msg);

                // 👉 成功後紀錄並導向聊天室頁
                localStorage.setItem("CatPaw_GroupCode", groupCode);
                window.location.href = "/CustomersArea/guest-chat.html";
            } catch (err) {
                alert("❌ 加入失敗：" + err.message);
            }
        });
    </script>
</body>

</html>
