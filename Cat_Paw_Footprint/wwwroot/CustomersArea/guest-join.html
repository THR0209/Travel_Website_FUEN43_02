<!doctype html>
<html lang="zh-Hant">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>訪客加入聊天室</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/front-end/assets/js/webFront.js"></script>


    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
            font-family: "Segoe UI", system-ui, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
            border: none;
            border-radius: 1rem;
        }

            .btn-join {
                color: #7ec8e3;
                border: 1px solid #7ec8e3;
                background: transparent;
                border-radius: 999px;
                transition: all 0.25s ease;
            }

                .btn-join:hover {
                    background: #7ec8e3;
                    color: #fff;
                    box-shadow: 0 0 0.4rem rgba(102, 188, 217, 0.35);
                }
    </style>
</head>

<body>
    <div class=" p-4" style="width: 360px;">
        <h4 class="text-center mb-3">🐾 訪客加入聊天室</h4>

        <form id="joinForm">
            <div class="mb-3">
                <label for="groupCode" class="form-label">群組代碼</label>
                <input type="text" id="groupCode" class="form-control" placeholder="輸入群組代碼" required>
            </div>

            <div class="mb-3">
                <label for="temporaryName" class="form-label">暱稱（可留空）</label>
                <input type="text" id="temporaryName" class="form-control" placeholder="顯示暱稱">
            </div>

            <button type="submit" class="btn btn-join w-100">加入群組</button>
        </form>

        <div id="result" class="alert mt-3 d-none"></div>
    </div>

    <script>
        // 自動生成訪客裝置識別碼
        const deviceIdKey = "CatPaw_DeviceId";
        let deviceId = localStorage.getItem(deviceIdKey);
        if (!deviceId) {
            deviceId = "dev-" + crypto.randomUUID();
            localStorage.setItem(deviceIdKey, deviceId);
        }

        const resultBox = document.getElementById("result");
        document.getElementById("joinForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const groupCode = document.getElementById("groupCode").value.trim();
            const temporaryName = document.getElementById("temporaryName").value.trim();

            const dto = { groupCode, temporaryName, deviceId };

            try {
                const res = await axios.post("/api/TalkMessageApi/JoinAsGuest", dto);
                const msg = res.data.message || "未知回應";

                // ✅ 使用 SweetAlert2 框框
                if (msg === "成功加入群組" || msg === "歡迎回來") {
                    window.showAlert("success", msg, "即將進入聊天室");
                    localStorage.setItem("CatPaw_GroupCode", groupCode);
                    localStorage.setItem("CatPaw_TemporaryName", temporaryName);

                    setTimeout(() => {
                        window.location.href = "/CustomersArea/guest-chat.html";
                    }, 1800);
                } else {
                    window.showAlert("warning", "加入失敗", msg);
                }

            } catch (err) {
                window.showAlert("error", "伺服器錯誤", err.message);
            }
        });
    </script>
</body>

</html>
