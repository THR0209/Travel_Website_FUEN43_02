<!doctype html>
<html lang="zh-Hant">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>客戶加入聊天室</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css?v=20251103" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js?v=20251103"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js?v=20251103"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11?v=20251103"></script>
    <script src="/front-end/assets/js/webFront.js?v=20251103"></script>

    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
            font-family: "Segoe UI", system-ui, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
            border: none;
            border-radius: 1rem;
        }

        .btn-join {
            color: #7ec8e3;
            border: 1px solid #7ec8e3;
            background: transparent;
            border-radius: 999px;
            transition: all 0.25s ease;
        }

            .btn-join:hover {
                background: #7ec8e3;
                color: #fff;
                box-shadow: 0 0 0.4rem rgba(102, 188, 217, 0.35);
            }
    </style>
</head>

<body>
    <div class="card p-4" style="width: 360px;">
        <h4 class="text-center mb-3">🐾 客戶加入聊天室</h4>

        <form id="joinForm">
            <div class="mb-3">
                <label for="groupCode" class="form-label">群組代碼</label>
                <input type="text" id="groupCode" class="form-control" placeholder="輸入群組代碼" required>
            </div>
            <button type="submit" class="btn btn-join w-100">加入群組</button>
        </form>

        <div id="result" class="alert mt-3 d-none"></div>
    </div>

    <script>
        axios.defaults.withCredentials = true; // ✅ 確保 cookie (CustomerAuth) 會帶出

        // 取得目前登入會員資訊
        async function loadCustomerInfo() {
            try {
                const res = await axios.get("/api/TalkMessageApi/GetCustomerInfo");
                if (res.data.success) {
                    const info = res.data.data;
                    // 用會員名稱取代暱稱
                    localStorage.setItem("CatPaw_TemporaryName", info.fullName || info.account || "未命名會員");
                    localStorage.setItem("CatPaw_CustomerId", info.customerId);
                    console.log("✅ 設定會員名稱成功：", info.fullName);
                } else {
                    showAlert("warning", "登入狀態異常", "請先登入會員帳號！");
                    window.location.href = "/CustomersArea/CusLogReg/Login";
                }
            } catch (err) {
                showAlert("error", "取得登入狀態失敗", "請重新登入");
                window.location.href = "/CustomersArea/CusLogReg/Login";
            }
        }

        // 執行載入登入狀態檢查
        loadCustomerInfo();

        document.getElementById("joinForm").addEventListener("submit", async (e) => {
            e.preventDefault();

            const groupCode = document.getElementById("groupCode").value.trim();

            try {
                const res = await axios.post("/api/TalkMessageApi/JoinAsCustomer", `"${groupCode}"`, {
                    headers: { "Content-Type": "application/json" }
                });
                const msg = res.data.message || "未知回應";

                if (msg === "成功加入群組" || msg === "歡迎回來") {
                    showAlert("success", "加入成功", msg);
                    localStorage.removeItem("CatPaw_DeviceId");
                    localStorage.setItem("CatPaw_GroupCode", groupCode);

                    setTimeout(() => {
                        window.location.href = "/CustomersArea/guest-chat.html";
                    }, 1500);
                } else {
                    showAlert("warning", "加入失敗", msg);
                }

            } catch (err) {
                console.error("❌ 加入失敗", err);
                const msg = err.response?.data?.message || err.message || "無法連線至伺服器";
                showAlert("error", "加入失敗", msg);
            }
        });
    </script>
</body>

</html>
