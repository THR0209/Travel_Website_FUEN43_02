<!doctype html>
<html lang="zh-Hant">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>客戶加入聊天室</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
            font-family: "Segoe UI", system-ui, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
            border: none;
            border-radius: 1rem;
        }

        .btn-join {
            background: linear-gradient(45deg, #4e54c8, #8f94fb);
            color: white;
            font-weight: 600;
            transition: all .3s;
        }

        .btn-join:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>

<body>
    <div class="card p-4" style="width: 360px;">
        <h4 class="text-center mb-3">🐾 客戶加入聊天室</h4>

        <form id="joinForm">
            <div class="mb-3">
                <label for="groupCode" class="form-label">群組代碼</label>
                <input type="text" id="groupCode" class="form-control" placeholder="輸入群組代碼" required>
            </div>
            <button type="submit" class="btn btn-join w-100">加入群組</button>
        </form>

        <div id="result" class="alert mt-3 d-none"></div>
    </div>

    <script>
        axios.defaults.withCredentials = true; // ✅ 確保 cookie (CustomerAuth) 會帶出

        // 取得目前登入會員資訊
        async function loadCustomerInfo() {
            try {
                const res = await axios.get("/api/TalkMessageApi/GetCustomerInfo");
                if (res.data.success) {
                    const info = res.data.data;
                    // 用會員名稱取代暱稱
                    localStorage.setItem("CatPaw_TemporaryName", info.fullName || info.account || "未命名會員");
                    localStorage.setItem("CatPaw_CustomerId", info.customerId);
                    console.log("✅ 設定會員名稱成功：", info.fullName);
                } else {
                    console.warn("⚠️ 尚未登入會員");
                    alert("⚠️ 尚未登入，請先登入會員帳號！");
                    window.location.href = "/CustomersArea/CusLogReg/Login";
                }
            } catch (err) {
                alert("⚠️ 無法取得登入狀態，請重新登入");
                window.location.href = "/CustomersArea/CusLogReg/Login";
            }
        }

        // 執行載入登入狀態檢查
        loadCustomerInfo();

        document.getElementById("joinForm").addEventListener("submit", async (e) => {
            e.preventDefault();

            const groupCode = document.getElementById("groupCode").value.trim();

            try {
                const res = await axios.post("/api/TalkMessageApi/JoinAsCustomer", `"${groupCode}"`, {
                    headers: { "Content-Type": "application/json" }
                });
                const msg = res.data.message || "未知回應";

                alert("✅ " + msg);

                // 成功後記錄群組代碼並導向聊天室頁
                if (msg === "成功加入群組" || msg === "歡迎回來") {
                    localStorage.removeItem("CatPaw_DeviceId");

                    localStorage.setItem("CatPaw_GroupCode", groupCode);

                    
                    window.location.href = "/CustomersArea/guest-chat.html"; // ✅ 若之後要改可替換
                }

            } catch (err) {
                console.error("❌ 加入失敗", err);
                alert("❌ 加入失敗：" + (err.response?.data?.message || err.message));
            }
        });
    </script>
</body>

</html>
